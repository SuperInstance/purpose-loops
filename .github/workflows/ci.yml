# purpose-loops CI: the suite plus the standing control check — the negative
# control's rung must stay flat (see lib/control-ladder.mjs).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm test
        run: npm test
      - name: control rung stays flat
        run: node lib/control-ladder.mjs demo/summary.json
